name: Receiver

on:
  push:
    paths:
      - 'receiver/**'
      - '.github/workflows/receiver.yml'
  pull_request:
    paths:
      - 'receiver/**'
      - '.github/workflows/receiver.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: receiver/go.mod
          cache-dependency-path: receiver/go.sum
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race -count=1 ./...

  windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: receiver/go.mod
          cache-dependency-path: receiver/go.sum
      - name: Build for Windows
        working-directory: receiver
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o ../dist/recam-receiver.exe .
      - name: Package
        run: cp receiver/README.md dist/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ReCam-receiver-windows
          path: dist/
